<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Wishlist | ÚNIQVE®</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>

    <!-- Sticky Navigation Bar -->
    <nav id="main-navbar">
        <a href="home.html" class="nav-brand">ÚNIQVE<span class="gold-accent">®</span></a>
        <ul class="nav-links" id="nav-links-list">
            <li><a href="home.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="shoes.html">Shoes</a></li>
            <li><a href="clothing.html">Clothing</a></li>
            <li><a href="accessories.html">Accessories</a></li>
        </ul>
        <div class="nav-icons">
            <button onclick="app.toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>
            <a href="search.html" title="Search">🔍</a>
            <a href="wishlist.html" title="Wishlist" style="color:var(--accent-gold);">❤️ <span id="wishlist-badge" class="nav-badge">0</span></a>
            <a href="cart.html" title="Cart">🛒 <span id="cart-badge" class="nav-badge">0</span></a>
            <a href="profile.html" title="Profile">👤</a>
            <button class="mobile-menu-toggle" onclick="app.toggleMobileMenu()">☰</button>
        </div>
    </nav>

    <!-- Header Banner -->
    <header style="text-align:center; padding: 60px 5%; background: var(--bg-primary); color: #fff;">
        <h1 style="text-transform: uppercase; letter-spacing: 2px;">Saved Favorites</h1>
        <p style="color: var(--accent-gold); letter-spacing: 1px; font-size: 0.9rem; margin-top: 10px; font-weight:700;">Your Curated Wishlist Collection</p>
    </header>

    <!-- Wishlist Grid Container -->
    <main style="max-width: 1400px; margin: 40px auto 60px; padding: 0 5%;">
        <div class="product-grid" id="wishlist-grid">
            <!-- Dynamically populated via wishlist.js -->
        </div>
    </main>

    <!-- Footer Component -->
    <footer>
        <div class="footer-bottom" style="border:none; text-align:center;">
            <span>&copy; 2026 ÚNIQVE Global Inc. All Rights Reserved.</span>
        </div>
    </footer>

    <!-- Runtime Scripts -->
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <!-- GSAP & Lenis Smooth Motion Engine CDN -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/wishlist.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            wishlistCtrl.renderWishlistView();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | ÚNIQVE®</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .product-detail-container {
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 5%;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .options-group {
            margin-bottom: 25px;
        }

        .options-group label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- Sticky Navigation Bar -->
    <nav id="main-navbar">
        <a href="home.html" class="nav-brand">ÚNIQVE<span class="gold-accent">®</span></a>
        <ul class="nav-links" id="nav-links-list">
            <li><a href="home.html">Home</a></li>
            <li><a href="shop.html">Shop (200+)</a></li>
            <li><a href="shoes.html">Shoes</a></li>
            <li><a href="clothing.html">Clothing</a></li>
            <li><a href="accessories.html">Accessories</a></li>
        </ul>
        <div class="nav-icons">
            <button onclick="app.toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>
            <a href="search.html" title="Search">🔍</a>
            <a href="wishlist.html" title="Wishlist">❤️ <span id="wishlist-badge" class="nav-badge">0</span></a>
            <a href="cart.html" title="Cart">🛒 <span id="cart-badge" class="nav-badge">0</span></a>
            <a href="profile.html" title="Profile">👤</a>
            <button class="mobile-menu-toggle" onclick="app.toggleMobileMenu()">☰</button>
        </div>
    </nav>

    <!-- Main Dynamic Container with Image on Top -->
    <main class="product-detail-container" id="product-detail-view">
        <!-- Dynamically injected based on ID parameter via product.js -->
    </main>

    <!-- Footer Component -->
    <footer>
        <div class="footer-bottom" style="border:none; text-align:center;">
            <span>&copy; 2026 ÚNIQVE Global Inc. All Rights Reserved.</span>
        </div>
    </footer>

    <!-- Runtime Scripts -->
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/product.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            prodDetailCtrl.loadProductPage();
        });
    </script>
</body>
</html>
